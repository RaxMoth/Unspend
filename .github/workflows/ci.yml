name: CI

# Runs on every push to main and on every pull request targeting main.
#
#   • analyze-and-test: formatting, static analysis and the Dart test suite
#     (unit, widget, responsive layout matrix, accessibility), with coverage.
#   • android: a debug build and the Kotlin rule engine's unit tests.
#   • ios: the native rule engine's Swift tests and a simulator build, so a
#     change that breaks the Xcode project or the Swift code fails here
#     rather than on someone's machine.
#
# What CI cannot check is blocking on a real device (Screen Time does not
# run in the Simulator, and no emulator runs here); see docs/PUBLISH.md,
# section 0.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-progress run for a ref when a newer commit is pushed to it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.41.2

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: error

  android:
    name: Android build & Kotlin tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Building first lets Flutter write the Gradle files the tests need.
      - name: Build the app
        run: flutter build apk --debug

      - name: Kotlin rule-engine tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

  ios:
    name: iOS build & Swift tests
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select the newest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Swift rule-engine tests
        run: swift test --package-path ios/Shared

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build for the simulator
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: flutter build ios --simulator --debug
